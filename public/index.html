<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicPass - Passwordless Authentication</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SimpleWebAuthn browser client bundle -->
  <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-xl p-8 border border-slate-700">
    <div class="text-center mb-8">
      <div class="inline-flex p-2 px-3 rounded-full bg-indigo-500/10 text-indigo-400 mb-3 font-mono text-xs font-semibold">
        FIDO2 / WebAuthn Powered
      </div>
      <h1 class="text-2xl font-bold tracking-tight">CivicPass Login</h1>
      <p class="text-slate-400 text-sm mt-1">Phishing-Resistant Identity System</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Username / Identifier</label>
        <input 
          id="username" 
          type="text" 
          placeholder="e.g. rahul@gov.in"
          class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white text-sm"
        />
      </div>

      <div class="flex gap-3 pt-2">
        <button 
          id="btn-register"
          class="flex-1 py-3 px-4 bg-slate-700 hover:bg-slate-600 rounded-xl font-medium text-sm transition border border-slate-600"
        >
          Enroll Passkey
        </button>
        <button 
          id="btn-login"
          class="flex-1 py-3 px-4 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-medium text-sm transition shadow-lg shadow-indigo-600/30"
        >
          Sign In
        </button>
      </div>

      <div id="status-card" class="hidden mt-6 p-4 rounded-xl border text-sm transition-all"></div>
    </div>
  </div>

  <script>
    const { startRegistration, startAuthentication } = SimpleWebAuthnBrowser;

    const usernameInput = document.getElementById('username');
    const btnRegister = document.getElementById('btn-register');
    const btnLogin = document.getElementById('btn-login');
    const statusCard = document.getElementById('status-card');

    function showStatus(message, isError = false) {
      statusCard.className = `mt-6 p-4 rounded-xl border text-sm transition-all ${
        isError ? 'bg-red-500/10 border-red-500/30 text-red-400' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'
      }`;
      statusCard.innerHTML = message;
      statusCard.classList.remove('hidden');
    }

    // --- 1. Enroll Passkey ---
    btnRegister.addEventListener('click', async () => {
      const username = usernameInput.value.trim();
      if (!username) return showStatus('Please enter a username first', true);

      try {
        showStatus('Requesting enrollment options...');
        const resp = await fetch('/api/auth/register-challenge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username }),
        });
        const options = await resp.json();
        if (options.error) throw new Error(options.error);

        showStatus('Scan fingerprint / PIN on your device...');
        const attestation = await startRegistration({ optionsJSON: options });

        const verifyResp = await fetch('/api/auth/register-verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(attestation),
        });
        const verificationResult = await verifyResp.json();

        if (verificationResult.verified) {
          showStatus('✅ Passkey created & bound to your hardware successfully!');
        } else {
          showStatus('❌ Registration failed: ' + verificationResult.error, true);
        }
      } catch (err) {
        showStatus('❌ ' + err.message, true);
      }
    });

    // --- 2. Sign In with Passkey ---
    btnLogin.addEventListener('click', async () => {
      const username = usernameInput.value.trim();
      if (!username) return showStatus('Please enter your username', true);

      try {
        showStatus('Requesting challenge...');
        const resp = await fetch('/api/auth/login-challenge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username }),
        });
        const options = await resp.json();
        if (options.error) throw new Error(options.error);

        showStatus('Scan biometrics to verify...');
        const assertion = await startAuthentication({ optionsJSON: options });

        const verifyResp = await fetch('/api/auth/login-verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(assertion),
        });
        const verificationResult = await verifyResp.json();

        if (verificationResult.verified) {
          showStatus(`🎉 Welcome back, <b>${verificationResult.username}</b>! Authenticated securely without passwords.`);
        } else {
          showStatus('❌ Login failed: ' + verificationResult.error, true);
        }
      } catch (err) {
        showStatus('❌ ' + err.message, true);
      }
    });
  </script>
</body>
</html>
